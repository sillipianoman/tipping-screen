<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #000000; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
            padding: 20px;
        }
        
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        h1 { 
            color: #ffffff; 
            font-size: 32px; 
            font-weight: 700; 
            line-height: 1.2;
            margin: 0 0 10px 0; 
        }
        h2 { 
            color: #ffffff; 
            font-size: 20px; 
            font-weight: 400; 
            margin: 0 0 25px 0; 
        }
        
        .btn-row { 
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 12px; 
            margin-bottom: 12px;
        }
        .vertical-layout {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #1e70e9; 
            color: #ffffff; 
            padding: 25px 10px; 
            border-radius: 4px; 
            text-decoration: none; 
            font-size: 24px; 
            font-weight: 600; 
            cursor: pointer;
            border: none;
            width: 100%;
        }
        .btn.custom { 
            grid-column: span 3; 
            padding: 12px 10px; 
            font-size: 14px; 
            font-weight: 400;
        }
        .btn.next {
            background: #ffffff;
            color: #000000;
            font-size: 20px;
            padding: 20px;
        }
        
        .btn:active { opacity: 0.8; }

        /* QR Container Styling */
        .qr-container {
            background: white;
            padding: 15px;
            display: inline-block;
            border-radius: 8px;
            margin-top: 20px;
        }
        .qr-container img {
            display: block;
            width: 180px;
            height: 180px;
            object-fit: contain; /* Keeps your official QR code looking perfect */
        }

        /* 🔄 50/50 SPLIT FOR HORIZONTAL VIEW */
        @media (orientation: landscape) {
            .container { max-width: 800px; }
            h1 { font-size: 26px; }
            .btn { padding: 18px 10px; font-size: 18px; }
            .btn.custom { padding: 10px 10px; font-size: 13px; }
            
            #screen3-split {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 40px;
            }
            
            .split-left {
                flex: 1;
                text-align: left;
            }
            
            .split-right {
                flex: 1;
                display: flex;
                justify-content: center;
            }
            
            .qr-container {
                margin-top: 0; 
            }
            .qr-container img {
                width: 200px; 
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- SCREEN 1 -->
        <div id="screen1" class="screen active">
            <h1>it’s just gonna ask you a few questions on the screen</h1>
            <h2>Leave A Tip?</h2>
            <div class="btn-row">
                <button class="btn" onclick="nextScreen(2)">15%</button>
                <button class="btn" onclick="nextScreen(2)">20%</button>
                <button class="btn" onclick="nextScreen(2)">25%</button>
                <button class="btn custom" onclick="nextScreen(2)">Custom</button>
            </div>
        </div>

        <!-- SCREEN 2 -->
        <div id="screen2" class="screen">
            <h1>Rate your service experience today</h1>
            <h2>(the people in the walls are watching you)</h2>
            <div class="vertical-layout">
                <button class="btn" onclick="nextScreen(3)">⭐⭐⭐⭐⭐ it would be so awesome</button>
                <button class="btn" onclick="nextScreen(3)">⭐⭐⭐ meh</button>
                <button class="btn" onclick="nextScreen(3)">❌ straight ass bro</button>
            </div>
        </div>

        <!-- SCREEN 3 -->
        <div id="screen3" class="screen">
            <div id="screen3-split">
                <div class="split-left">
                    <h1>Confirm and Pay</h1>
                    <h2>Tap to finish transaction or scan the code</h2>
                    <button class="btn next" onclick="redirectToCashApp()">Complete Transaction</button>
                </div>
                
                <div class="split-right">
                    <div class="qr-container">
                        <!-- 🔄 LOOKS FOR YOUR LOCAL UPLOADED FILE NOW -->
                        <img src="qr.png" alt="Scan to pay">
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        function nextScreen(screenNumber) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById('screen' + screenNumber).classList.add('active');
        }

        function redirectToCashApp() {
            // Your link fallback remains active if they press the button
            window.location.href = "https://cash.app/$therealpianoman"; 
        }
    </script>

</body>
</html>
