<html>
<head>

        body { font-family: sans-serif; background: #f4f4f4; text-align: center; padding: 50px 20px; }

        h2 { color: #333; margin-bottom: 30px; }
        .btn { display: block; background: #00D632; color: white; padding: 20px; margin: 15px 0; border-radius: 8px; text-decoration: none; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>It's just gonna ask you a quick question...</h2>
        <a class="btn" href="https://cash.app">15% ($5.00)</a>
        <a class="btn" href="https://cash.app">50% ($20.00)</a>
        <a class="btn" href="https://cash.app">100% ($40.00)</a>
        <a class="btn" href="https://cash.app">Custom (Min. $50)</a>
    </div>
</body>
</html>
