<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f4f5f7; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
        }
        .container { 
            background: white; 
            padding: 40px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
        }
        h2 { color: #1a1a1a; font-size: 24px; margin-top: 0; margin-bottom: 30px; font-weight: 600; }
        
        /* Button layout for vertical / upright view */
        .btn-grid { display: flex; flex-direction: column; gap: 15px; }
        
        .btn { 
            display: block; 
            background: #00D632; 
            color: white; 
            padding: 22px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-size: 20px; 
            font-weight: 700; 
            transition: transform 0.1s ease;
        }
        .btn:active { transform: scale(0.98); }
        .btn.custom { background: #1a1a1a; }

        /* 🔄 HORIZONTAL / LANDSCAPE MODE MAGIC */
        @media (orientation: landscape) {
            .container { max-width: 750px; padding: 30px; }
            h2 { margin-bottom: 20px; font-size: 22px; }
            .btn-grid { 
                display: grid; 
                grid-template-columns: 1fr 1fr; /* Splits buttons into a 2x2 grid */
                gap: 15px; 
            }
            .btn { padding: 18px; font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>It's just gonna ask you a quick question...</h2>
        <div class="btn-grid">
            <a class="btn" href="https://cash.app">10% ($1.00)</a>
            <a class="btn" href="https://cash.app">20% ($20.00)</a>
            <a class="btn" href="https://cash.app">35% ($35.00)</a>
            <a class="btn" href="https://cash.app">45% ($45.00)</a>
            <a class="btn" href="https://cash.app">50% ($50.00)</a>
            <a class="btn" href="https://cash.app">60% ($60.00)</a>
            <a class="btn" href="https://cash.app">75% ($75.00)</a>
            <a class="btn" href="https://cash.app">100% ($100.00)</a>
            <a class="btn custom" href="https://cash.app">Custom (Min. $10)</a>
        </div>
    </div>
</body>
</html>
